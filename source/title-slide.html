<section id="title-slide" class="center" style="text-align: center;">
  <h1 class="title">$title$</h1>
  $if(subtitle)$
  <p class="subtitle">$subtitle$</p>
  $endif$
  <p class="author">$author$</p>
  $if(date)$
  <p class="date">$date$</p>
  $endif$
  <div style="margin-top: 1.4rem;">
    <img src="images/website.png" alt="Companion site QR code" style="height: 130px; background: #ffffff; padding: 8px; border-radius: 8px;">
    <p style="font-size: 0.75em; opacity: 0.75; margin-top: 0.4rem;">Companion site &mdash; every prompt from today</p>
  </div>
</section>
